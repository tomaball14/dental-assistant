<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F8FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Front Desk Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F6F8FA; --surface: #FFFFFF; --ink: #16233B; --soft: #5A6680; --line: #DDE3EA;
  --red: #C4322A; --red-wash: #FBEAE8; --blue: #2457C9; --blue-ink: #FFFFFF; --blue-wash: #E8EEFB;
  --green: #1E7A4C;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1522; --surface: #18202F; --ink: #E7ECF4; --soft: #9BA6BB; --line: #2A3447;
    --red: #F07B72; --red-wash: #3A1E22; --blue: #6F9BFF; --blue-ink: #0F1522; --blue-wash: #1D2B48; --green: #6FD39C;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1522; --surface: #18202F; --ink: #E7ECF4; --soft: #9BA6BB; --line: #2A3447;
  --red: #F07B72; --red-wash: #3A1E22; --blue: #6F9BFF; --blue-ink: #0F1522; --blue-wash: #1D2B48; --green: #6FD39C;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  position: fixed; inset: 0 0 auto 0; height: var(--app-h, 100dvh);
  background: var(--paper); color: var(--ink);
  font: 16px/1.42 "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  display: flex; flex-direction: column;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

header {
  flex: none;
  padding: max(8px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left));
  border-bottom: 1px solid var(--line); background: var(--paper);
}
.bar { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--blue); color: var(--blue-ink);
  display: grid; place-items: center; flex: none;
}
.avatar svg { width: 18px; height: 18px; }
.who { line-height: 1.2; }
.who b { display: block; font-size: 16px; }
.who span { white-space: nowrap; }
.who span { font-size: 13px; color: var(--soft); }
.who span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }

#log { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 12px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); }
.thread { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

.msg { max-width: 84%; overflow-wrap: anywhere; }
.msg.bot { max-width: 94%; }
.msg.me, .msg.bot .text { white-space: pre-wrap; }
.msg.me {
  align-self: flex-end; background: var(--blue); color: var(--blue-ink);
  padding: 8px 13px; border-radius: 18px 18px 5px 18px;
}
.msg.bot { align-self: flex-start; padding: 2px 2px; }
.msg.bot .text { padding: 9px 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px 18px 18px 5px; }
.msg.bot .text:empty { display: none; }
.msg.bot .text .flag { display: block; padding-left: 16px; position: relative; margin: 4px 0; }
.msg.bot .text .flag::before { content: ""; position: absolute; left: 2px; top: .55em; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--soft); animation: blink 1.2s infinite both; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

/* Estimate: the one loud thing on the screen */
.est { margin-top: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; width: min(400px, 100%); }
.est-top { padding: 12px 14px 10px; }
.est-name { font-size: 14px; color: var(--soft); }
.est-total { font-size: clamp(34px, 10vw, 44px); font-weight: 700; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
.est-total small { font-size: 15px; font-weight: 400; letter-spacing: 0; color: var(--soft); margin-left: 6px; }
.est-ins { font-size: 15px; color: var(--soft); }
.est-lines { list-style: none; margin: 0; padding: 2px 14px; border-top: 1px dashed var(--line); }
.est-lines li { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; font-size: 15px; }
.est-lines li + li { border-top: 1px solid var(--line); }
.tooth { flex: none; font-size: 12px; font-weight: 700; min-width: 30px; text-align: center; padding: 1px 6px; border-radius: 999px; border: 1.5px solid var(--ink); }
.est-lines .nm { flex: 1; }
.est-lines .amt { font-variant-numeric: tabular-nums; font-weight: 700; }
.est-note { margin: 0; padding: 9px 14px 10px; font-size: 14px; color: var(--red); background: var(--red-wash); }

/* Draft text the patient will receive */
.draft { margin-top: 6px; width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.draft h3 { margin: 0; font-size: 16px; }
.draft .to { font-size: 14px; color: var(--soft); margin: 2px 0 10px; }
.draft textarea {
  width: 100%; min-height: 90px; resize: none; border: 0; padding: 9px 12px; display: block;
  background: var(--blue-wash); border-radius: 14px 14px 14px 4px; line-height: 1.4; font-size: 16px;
}
.draft .row { display: flex; gap: 8px; margin-top: 10px; }
.draft .row .primary { flex: 1; }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; min-height: 44px; font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--blue); color: var(--blue-ink); }
.btn.quiet { background: transparent; color: var(--soft); }
.btn:disabled { opacity: .5; cursor: default; }
.draft.done { opacity: .7; }

.chips {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  margin: 2px calc(-1 * max(12px, env(safe-area-inset-left))) 0; padding: 2px max(12px, env(safe-area-inset-left)) 4px;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; white-space: nowrap; min-height: 38px;
  border: 1.5px solid var(--blue); background: var(--surface); color: var(--blue);
  border-radius: 999px; padding: 7px 14px; font-size: 15px; font-weight: 700; cursor: pointer;
}
@media (min-width: 700px) { .chips { flex-wrap: wrap; overflow: visible; margin: 2px 0 0; padding: 0; } }
.chip:hover { background: var(--blue-wash); }

footer { flex: none; border-top: 1px solid var(--line); background: var(--paper);
  padding: 8px max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
form.compose { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
#q {
  flex: 1; min-width: 0; resize: none; max-height: 120px; min-height: 44px; padding: 10px 15px; line-height: 1.4; font-size: 16px;
  border: 1.5px solid var(--line); border-radius: 22px; background: var(--surface); display: block;
}
#q:focus { border-color: var(--blue); outline: none; }
.send { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: var(--blue); color: var(--blue-ink); cursor: pointer; display: grid; place-items: center; }
.send svg { width: 20px; height: 20px; }
.send:disabled { opacity: .4; }

.lock { position: fixed; inset: 0; height: var(--app-h, 100dvh); background: var(--paper); display: grid; place-items: center; padding: 24px; z-index: 5; }
.lock[hidden] { display: none; }
.lock form { width: min(340px, 100%); }
.lock h2 { margin: 0 0 6px; font-size: 24px; }
.lock p { margin: 0 0 16px; color: var(--soft); }
.lock input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 10px; font-size: 18px; letter-spacing: .1em; }
.lock .btn { width: 100%; }
.lock .err { color: var(--red); min-height: 1.4em; font-size: 15px; }

.attach { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--soft); cursor: pointer; display: grid; place-items: center; }
.attach svg { width: 20px; height: 20px; }
.attach:hover { color: var(--blue); border-color: var(--blue); }

/* What we read from an Eaglesoft export */
.import { margin-top: 6px; width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.import h3 { margin: 0 0 2px; font-size: 16px; }
.import .meta { font-size: 14px; color: var(--soft); margin: 0 0 8px; }
.import dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 14px; }
.import dt { color: var(--soft); }
.import dd { margin: 0; overflow-wrap: anywhere; }
.import dd.none { color: var(--red); }
.import .warn { margin: 10px 0 0; font-size: 14px; color: var(--red); }
.import .where { margin: 10px 0 0; font-size: 13px; color: var(--soft); }
.import details { margin-top: 10px; font-size: 14px; }
.import summary { cursor: pointer; color: var(--blue); font-weight: 700; padding: 4px 0; }
.import label { display: block; margin-top: 8px; color: var(--soft); }
.import select { width: 100%; margin-top: 2px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 16px; }
.import .row { display: flex; gap: 8px; margin-top: 12px; }
.import .row .primary { flex: 1; }
.import.done .row { display: none; }

@media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5c-1.6-1.2-4.3-1.6-6 0-2.2 2-1.4 5.6-.6 8.3.6 2 .9 4.6 1.6 6.6.5 1.4 1.9 1.6 2.5.2.6-1.5.7-3.6 2.5-3.6s1.9 2.1 2.5 3.6c.6 1.4 2 1.2 2.5-.2.7-2 1-4.6 1.6-6.6.8-2.7 1.6-6.3-.6-8.3-1.7-1.6-4.4-1.2-6 0z"/></svg>
    </div>
    <div class="who"><b id="practice">Front Desk Assistant</b><span id="status">Connecting</span></div>
  </div>
</header>

<main id="log" aria-live="polite"><div class="thread" id="thread"></div></main>

<footer>
  <form class="compose" id="compose">
    <label for="q" class="sr" style="position:absolute;left:-9999px">Message</label>
    <button class="attach" id="attachBtn" type="button" aria-label="Upload a schedule export from Eaglesoft">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.5 8.5a5 5 0 01-7-7L14 4.5a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L15 7.5"/></svg>
    </button>
    <input type="file" id="file" accept=".csv,.txt,.tsv,.xlsx,.xls,text/csv" hidden>
    <textarea id="q" rows="1" placeholder="Message" autocomplete="off" enterkeyhint="send"></textarea>
    <button class="send" id="sendBtn" aria-label="Send" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
</footer>

<div class="lock" id="lock" hidden>
  <form id="lockForm">
    <h2>Office code</h2>
    <p>Enter the code your office uses for the assistant.</p>
    <input id="code" type="password" inputmode="text" autocomplete="current-password" aria-label="Office code">
    <div class="err" id="lockErr"></div>
    <button class="btn primary">Unlock</button>
  </form>
</div>

<script type="module">
import { parseCSV, buildPracticeData, sampleExport, FIELDS, FIELD_LABEL } from './import.js';

// Size the app to what's actually visible: handles mobile toolbars and the
// on-screen keyboard (iOS doesn't shrink the layout viewport for it).
(function fit() {
  const vv = window.visualViewport;
  const set = () => {
    document.documentElement.style.setProperty('--app-h', `${vv ? vv.height : window.innerHeight}px`);
    if (vv && vv.offsetTop) window.scrollTo(0, 0);
    const log = document.getElementById('log');
    if (log && document.activeElement?.id === 'q') log.scrollTop = log.scrollHeight;
  };
  set();
  (vv || window).addEventListener('resize', set);
  vv?.addEventListener('scroll', set);
})();
const $ = (s) => document.querySelector(s);
const thread = $('#thread');
const log = $('#log');
const money = (c) => '$' + Math.round((c || 0) / 100).toLocaleString('en-US');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const store = {
  get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let code = store.get('code') || '';
let history = [];   // text-only turns sent back for conversational memory
let context = {};   // last patient + treatment, so follow-ups like "send it to her" work
let busy = false;
let dataMode = 'browser';        // 'server' on an office computer, else the browser keeps it
let hostedOk = false;            // may real patient data be used on this deploy?
let practiceData = store.get('practiceData');

// ---------- network ----------
let unlockWaiters = [];
async function api(path, body) {
  const opts = { headers: { 'x-access-code': code } };
  if (body && dataMode === 'browser' && practiceData && !body.imported) body = { ...body, practiceData };
  if (body) { opts.method = body.method || 'POST'; opts.headers['content-type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  if (r.status === 401) { await askForCode(); return api(path, body); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'The assistant is unavailable. Check your connection and try again.');
  return j;
}
function askForCode(message) {
  $('#lock').hidden = false;
  $('#lockErr').textContent = code ? 'That code didn\'t work.' : '';
  $('#code').value = '';
  $('#code').focus();
  return new Promise((res) => unlockWaiters.push(res));
}
$('#lockForm').onsubmit = (e) => {
  e.preventDefault();
  code = $('#code').value.trim();
  if (!code) return;
  store.set('code', code);
  $('#lock').hidden = true;
  unlockWaiters.splice(0).forEach((f) => f());
};

// ---------- rendering ----------
function scrollDown() { requestAnimationFrame(() => log.scrollTo({ top: log.scrollHeight, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })); }

function addMine(text) {
  const d = document.createElement('div');
  d.className = 'msg me';
  d.textContent = text;
  thread.appendChild(d);
  scrollDown();
}

function botShell() {
  const d = document.createElement('div');
  d.className = 'msg bot';
  d.innerHTML = '<div class="text"><span class="typing" aria-label="Thinking"><span></span><span></span><span></span></span></div>';
  thread.appendChild(d);
  scrollDown();
  return d;
}

function formatReply(text) {
  // Problem lines in the briefing get the chart-red treatment.
  return esc(text).split('\n').map((line) =>
    line.startsWith('• ') ? `<span class="flag">${line.slice(2)}</span>` : line).join('\n').replace(/<\/span>\n/g, '</span>');
}

function estimateCard(b) {
  const lines = b.lines.map((l) => `<li>${l.tooth ? `<span class="tooth" aria-label="Tooth ${esc(l.tooth)}">#${esc(l.tooth)}</span>` : ''}<span class="nm">${esc(l.name)}</span><span class="amt">${money(l.patient)}</span></li>`).join('');
  const notes = b.notes?.length ? `<p class="est-note">${b.notes.map(esc).join('<br>')}</p>` : '';
  return `<div class="est" role="group" aria-label="Estimate for ${esc(b.patient)}">
    <div class="est-top">
      <div class="est-name">${esc(b.patient)} pays</div>
      <div class="est-total">${money(b.totals.patient)}<small>estimated</small></div>
      <div class="est-ins">Insurance pays ${money(b.totals.insurance)} of ${money(b.totals.fee)}</div>
    </div>
    <ul class="est-lines">${lines}</ul>${notes}
  </div>`;
}

function draftCard(b, holder) {
  const el = document.createElement('div');
  el.className = 'draft';
  el.innerHTML = `<h3>${esc(b.title)}</h3><div class="to">To ${esc(b.to)}</div>
    <textarea aria-label="Message to patient">${esc(b.text)}</textarea>
    <div class="row"><button class="btn primary" type="button">Send text</button><button class="btn quiet" type="button">Not now</button></div>`;
  const ta = el.querySelector('textarea');
  const grow = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  ta.addEventListener('input', grow);
  requestAnimationFrame(grow);
  const [sendB, skipB] = el.querySelectorAll('button');
  sendB.onclick = async () => {
    sendB.disabled = skipB.disabled = true;
    sendB.textContent = 'Sending';
    try {
      const r = await api('/api/confirm', { token: b.token, text: el.querySelector('textarea').value });
      el.classList.add('done');
      el.querySelector('textarea').readOnly = true;
      el.querySelector('.row').innerHTML = '';
      showBot(r);
    } catch (e) { sendB.disabled = skipB.disabled = false; sendB.textContent = 'Send text'; showBot({ reply: e.message }); }
  };
  skipB.onclick = () => { el.classList.add('done'); el.querySelector('.row').innerHTML = '<span class="to">Not sent.</span>'; };
  holder.appendChild(el);
}

function showBot(r, shell) {
  const d = shell || botShell();
  d.querySelector('.text').innerHTML = formatReply(r.reply || '');
  for (const b of r.blocks || []) {
    if (b.type === 'estimate') d.insertAdjacentHTML('beforeend', estimateCard(b));
    if (b.type === 'confirm') draftCard(b, d);
  }
  // Only the newest answer keeps its quick replies.
  thread.querySelectorAll('.chips').forEach((c) => c.remove());
  if (r.actions?.length) {
    const c = document.createElement('div');
    c.className = 'chips';
    r.actions.forEach((a) => {
      const btn = document.createElement('button');
      btn.className = 'chip'; btn.type = 'button'; btn.textContent = a.label;
      btn.onclick = () => ask(a.prompt, a.label);
      c.appendChild(btn);
    });
    d.after(c);
  }
  if (r.context) context = r.context;
  scrollDown();
}

// ---------- conversation ----------
async function ask(text, shown) {
  text = text.trim();
  if (!text || busy) return;
  if (text === '__sample__') return useSample();
  if (/^(clear|forget|remove|stop using) (my )?(data|upload|schedule|export)/i.test(text)) return clearData(shown || text);
  busy = true;
  addMine(shown || text);
  const shell = botShell();
  try {
    const r = await api('/api/assistant', { message: text, history, context });
    history.push({ role: 'user', content: text }, { role: 'assistant', content: r.reply || '' });
    history = history.slice(-12);
    showBot(r, shell);
  } catch (e) {
    showBot({ reply: e.message }, shell);
  } finally { busy = false; }
}

const q = $('#q');
q.addEventListener('input', () => {
  q.style.height = 'auto';
  q.style.height = Math.min(q.scrollHeight, 120) + 'px';
  $('#sendBtn').disabled = !q.value.trim();
});
q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#compose').requestSubmit(); }
});
$('#compose').onsubmit = (e) => {
  e.preventDefault();
  const t = q.value;
  q.value = ''; q.style.height = 'auto'; $('#sendBtn').disabled = true;
  ask(t);
};

// ---------- your own practice data ----------
let healthMode = 'demo';
let serverLoaded = null;
let pending = null; // an import waiting for "Use this schedule"

function loadedInfo() {
  if (dataMode === 'server') return serverLoaded;
  if (!practiceData?.appointments) return null;
  return { source: practiceData.source, fileName: practiceData.fileName, importedAt: practiceData.importedAt, appointments: practiceData.appointments.length };
}
function updateStatus() {
  const info = loadedInfo();
  const when = info?.importedAt ? new Date(info.importedAt).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' }) : '';
  $('#status').textContent = info?.appointments
    ? (info.source === 'sample' ? 'Sample export' : `Your schedule, uploaded ${when}`)
    : healthMode === 'live' ? 'Connected to your schedule' : 'Demo practice';
}
async function brief() {
  const shell = botShell();
  try { showBot(await api('/api/brief', dataMode === 'browser' && practiceData ? {} : undefined), shell); }
  catch (e) { showBot({ reply: e.message }, shell); }
}

$('#attachBtn').onclick = () => $('#file').click();
$('#file').onchange = async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  addMine(`Attached ${f.name}`);
  const shell = botShell();
  try {
    const rows = await readRows(f);
    importRows(rows, f.name, 'upload', shell);
  } catch (err) {
    showBot({ reply: `I couldn't open that file. Save it from Eaglesoft as CSV and try again. (${err.message})` }, shell);
  }
};

async function readRows(f) {
  if (/\.(xlsx|xls)$/i.test(f.name)) {
    if (!window.XLSX) await new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      sc.onload = res; sc.onerror = () => rej(new Error('Excel reader did not load'));
      document.head.appendChild(sc);
    });
    const wb = window.XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    return window.XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' })
      .map((r) => r.map((v) => String(v).trim())).filter((r) => r.some((v) => v));
  }
  return parseCSV(await f.text());
}

function importRows(rows, fileName, source, shell, mapping) {
  const r = buildPracticeData(rows, { fileName, source, mapping });
  if (r.error) return showBot({ reply: r.error }, shell);
  if (r.kind === 'fees') {
    if (!r.report.fees) return showBot({ reply: 'That looks like a fee schedule, but I couldn\'t read any fees from it.' }, shell);
    return saveImport({ kind: 'fees', fees: r.fees }, shell, `Got your fee schedule: ${r.report.fees} procedure fees. I'll use them for estimates.`);
  }
  pending = { rows, fileName, source, result: r };
  showBot({ reply: '' }, shell);
  shell.querySelector('.text').remove();
  shell.appendChild(importCard(r, source));
}

const KEY_FIELDS = ['name', 'firstName', 'lastName', 'dob', 'date', 'time', 'codes', 'tooth', 'fee', 'carrier', 'payerId', 'memberId', 'subscriber', 'relationship', 'phone'];
function importCard(r, source) {
  const rep = r.report;
  const el = document.createElement('div');
  el.className = 'import';
  const day = (d) => (d ? new Date(d + 'T12:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '?');
  const range = rep.dateFrom === rep.dateTo ? day(rep.dateFrom) : `${day(rep.dateFrom)} to ${day(rep.dateTo)}`;
  const shown = ['name', 'date', 'time', 'codes', 'carrier', 'memberId', 'payerId', 'dob', 'phone']
    .filter((f) => !(f === 'name' && r.mapping.name == null && r.mapping.lastName != null));
  const rowsHtml = shown.map((f) => {
    const i = f === 'name' && r.mapping.name == null ? r.mapping.lastName : r.mapping[f];
    return `<dt>${esc(FIELD_LABEL[f])}</dt><dd class="${i == null ? 'none' : ''}">${i == null ? 'not found' : esc(r.headers[i])}</dd>`;
  }).join('');
  const warns = [];
  if (!rep.appointments) warns.push('I didn\'t find any appointments. Check the columns below.');
  if (rep.missingPayerId) warns.push(`${rep.missingPayerId} insured patient${rep.missingPayerId > 1 ? 's have' : ' has'} no payer ID, so their insurance can't be checked automatically. Add a payer ID column to the report if Eaglesoft offers it.`);
  if (rep.missingMemberId) warns.push(`${rep.missingMemberId} insured patient${rep.missingMemberId > 1 ? 's have' : ' has'} no subscriber ID.`);
  if (rep.noProcedures) warns.push(`${rep.noProcedures} appointment${rep.noProcedures > 1 ? 's have' : ' has'} no procedures listed.`);
  const where = dataMode === 'server'
    ? 'Saved only on this office computer.'
    : 'Kept only in this browser tab until you close it.';
  const blocked = source !== 'sample' && dataMode === 'browser' && !hostedOk;
  const opts = (sel) => `<option value="">Not in this file</option>` + r.headers.map((h, i) => `<option value="${i}" ${String(sel) === String(i) ? 'selected' : ''}>${esc(h || `Column ${i + 1}`)}</option>`).join('');
  el.innerHTML = `
    <h3>${source === 'sample' ? 'Sample export' : esc(pending.fileName)}</h3>
    <p class="meta">${rep.appointments} appointments, ${rep.patients} patients, ${esc(range)}</p>
    <dl>${rowsHtml}</dl>
    ${warns.map((w) => `<p class="warn">${esc(w)}</p>`).join('')}
    <details><summary>Fix columns</summary>
      ${KEY_FIELDS.map((f) => `<label>${esc(FIELD_LABEL[f])}<select data-f="${f}">${opts(r.mapping[f])}</select></label>`).join('')}
    </details>
    ${blocked
      ? `<p class="warn">This online version can't hold real patient records yet. Run the office-computer version (or turn on hosting after the HIPAA agreement), then upload again.</p>
         <div class="row"><button class="btn quiet" type="button" data-a="cancel">OK</button></div>`
      : `<p class="where">${where}</p>
         <div class="row"><button class="btn primary" type="button" data-a="use">Use this schedule</button><button class="btn quiet" type="button" data-a="cancel">Cancel</button></div>`}`;
  el.querySelectorAll('select').forEach((sel) => sel.onchange = () => {
    const mapping = { ...pending.result.mapping };
    el.querySelectorAll('select').forEach((s2) => { if (s2.value === '') delete mapping[s2.dataset.f]; else mapping[s2.dataset.f] = Number(s2.value); });
    const holder = el.parentElement;
    el.remove();
    importRows(pending.rows, pending.fileName, pending.source, holder, mapping);
    holder.querySelector('.import details').open = true;
  });
  el.querySelector('[data-a="cancel"]').onclick = () => { el.classList.add('done'); pending = null; };
  const use = el.querySelector('[data-a="use"]');
  if (use) use.onclick = async () => {
    el.classList.add('done');
    const r2 = pending.result;
    pending = null;
    await saveImport(r2.data, null, null);
  };
  return el;
}

async function saveImport(imported, shell, message) {
  try {
    if (dataMode === 'server') {
      const r = await api('/api/practice-data', { imported });
      serverLoaded = r.loaded;
    } else {
      practiceData = imported.kind === 'fees'
        ? { ...(practiceData || { source: 'upload', patients: [], appointments: [] }), fees: imported.fees }
        : { ...imported, fees: { ...(practiceData?.fees || {}), ...(imported.fees || {}) } };
      store.set('practiceData', practiceData);
    }
    updateStatus();
    context = {}; history = [];
    if (message) showBot({ reply: message }, shell);
    else await brief();
  } catch (e) { showBot({ reply: e.message }, shell); }
}

function useSample() {
  addMine('Try a sample export');
  const shell = botShell();
  importRows(parseCSV(sampleExport()), 'Sample export', 'sample', shell);
}

async function clearData(shown) {
  addMine(shown);
  if (dataMode === 'server') { try { await api('/api/practice-data', { method: 'DELETE' }); } catch {} serverLoaded = null; }
  practiceData = null;
  try { sessionStorage.removeItem('practiceData'); } catch {}
  context = {}; history = [];
  updateStatus();
  showBot({ reply: 'Done. I\'ve forgotten the uploaded schedule.' });
  await brief();
}

// ---------- start: the assistant speaks first ----------
(async () => {
  try {
    const h = await fetch('/api/health').then((r) => r.json());
    if (h.practice) $('#practice').textContent = h.practice;
    healthMode = h.mode;
  } catch { $('#status').textContent = 'Offline'; }
  try {
    const pd = await api('/api/practice-data');
    dataMode = pd.mode; hostedOk = pd.hostedRealDataAllowed;
    if (dataMode === 'server') practiceData = null;
    serverLoaded = pd.loaded;
  } catch {}
  updateStatus();
  await brief();
})();
</script>
