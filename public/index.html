<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F8FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Front Desk Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F6F8FA; --surface: #FFFFFF; --ink: #16233B; --soft: #5A6680; --line: #DDE3EA;
  --red: #C4322A; --red-wash: #FBEAE8; --blue: #2457C9; --blue-ink: #FFFFFF; --blue-wash: #E8EEFB;
  --green: #1E7A4C;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1522; --surface: #18202F; --ink: #E7ECF4; --soft: #9BA6BB; --line: #2A3447;
    --red: #F07B72; --red-wash: #3A1E22; --blue: #6F9BFF; --blue-ink: #0F1522; --blue-wash: #1D2B48; --green: #6FD39C;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1522; --surface: #18202F; --ink: #E7ECF4; --soft: #9BA6BB; --line: #2A3447;
  --red: #F07B72; --red-wash: #3A1E22; --blue: #6F9BFF; --blue-ink: #0F1522; --blue-wash: #1D2B48; --green: #6FD39C;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 17px/1.45 "Atkinson Hyperlegible", system-ui, sans-serif;
  display: flex; flex-direction: column;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

header {
  padding: max(12px, env(safe-area-inset-top)) 16px 10px;
  border-bottom: 1px solid var(--line); background: var(--paper);
}
.bar { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; background: var(--blue); color: var(--blue-ink);
  display: grid; place-items: center; flex: none;
}
.avatar svg { width: 20px; height: 20px; }
.who { line-height: 1.2; }
.who b { display: block; font-size: 17px; }
.who span { font-size: 13px; color: var(--soft); }
.who span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }

#log { flex: 1; overflow-y: auto; padding: 16px 16px 8px; }
.thread { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

.msg { max-width: 88%; overflow-wrap: anywhere; }
.msg.me, .msg.bot .text { white-space: pre-wrap; }
.msg.me {
  align-self: flex-end; background: var(--blue); color: var(--blue-ink);
  padding: 9px 14px; border-radius: 20px 20px 6px 20px;
}
.msg.bot { align-self: flex-start; padding: 2px 2px; }
.msg.bot .text { padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px 20px 20px 6px; }
.msg.bot .text:empty { display: none; }
.msg.bot .text .flag { display: block; padding-left: 16px; position: relative; margin: 4px 0; }
.msg.bot .text .flag::before { content: ""; position: absolute; left: 2px; top: .55em; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--soft); animation: blink 1.2s infinite both; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

/* Estimate: the one loud thing on the screen */
.est { margin-top: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; width: min(420px, 100%); }
.est-top { padding: 14px 16px 12px; }
.est-name { font-size: 14px; color: var(--soft); }
.est-total { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
.est-total small { font-size: 15px; font-weight: 400; letter-spacing: 0; color: var(--soft); margin-left: 6px; }
.est-ins { font-size: 15px; color: var(--soft); }
.est-lines { list-style: none; margin: 0; padding: 4px 16px; border-top: 1px dashed var(--line); }
.est-lines li { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; font-size: 15px; }
.est-lines li + li { border-top: 1px solid var(--line); }
.tooth { flex: none; font-size: 12px; font-weight: 700; min-width: 30px; text-align: center; padding: 1px 6px; border-radius: 999px; border: 1.5px solid var(--ink); }
.est-lines .nm { flex: 1; }
.est-lines .amt { font-variant-numeric: tabular-nums; font-weight: 700; }
.est-note { margin: 0; padding: 10px 16px 12px; font-size: 14px; color: var(--red); background: var(--red-wash); }

/* Draft text the patient will receive */
.draft { margin-top: 8px; width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.draft h3 { margin: 0; font-size: 16px; }
.draft .to { font-size: 14px; color: var(--soft); margin: 2px 0 10px; }
.draft textarea {
  width: 100%; min-height: 120px; resize: vertical; border: 0; padding: 10px 12px;
  background: var(--blue-wash); border-radius: 14px 14px 14px 4px; line-height: 1.4; font-size: 16px;
}
.draft .row { display: flex; gap: 8px; margin-top: 10px; }
.btn { border: 0; border-radius: 12px; padding: 11px 18px; font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--blue); color: var(--blue-ink); }
.btn.quiet { background: transparent; color: var(--soft); }
.btn:disabled { opacity: .5; cursor: default; }
.draft.done { opacity: .7; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chip {
  border: 1.5px solid var(--blue); background: transparent; color: var(--blue);
  border-radius: 999px; padding: 7px 14px; font-size: 15px; font-weight: 700; cursor: pointer; text-align: left;
}
.chip:hover { background: var(--blue-wash); }

footer { border-top: 1px solid var(--line); background: var(--paper); padding: 10px 16px max(10px, env(safe-area-inset-bottom)); }
form.compose { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
#q {
  flex: 1; resize: none; max-height: 140px; min-height: 46px; padding: 11px 16px; line-height: 1.4;
  border: 1.5px solid var(--line); border-radius: 23px; background: var(--surface);
}
#q:focus { border-color: var(--blue); outline: none; }
.send { width: 46px; height: 46px; flex: none; border-radius: 50%; border: 0; background: var(--blue); color: var(--blue-ink); cursor: pointer; display: grid; place-items: center; }
.send svg { width: 20px; height: 20px; }
.send:disabled { opacity: .4; }

.lock { position: fixed; inset: 0; background: var(--paper); display: grid; place-items: center; padding: 24px; z-index: 5; }
.lock[hidden] { display: none; }
.lock form { width: min(340px, 100%); }
.lock h2 { margin: 0 0 6px; font-size: 24px; }
.lock p { margin: 0 0 16px; color: var(--soft); }
.lock input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 10px; font-size: 20px; letter-spacing: .1em; }
.lock .btn { width: 100%; }
.lock .err { color: var(--red); min-height: 1.4em; font-size: 15px; }

@media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5c-1.6-1.2-4.3-1.6-6 0-2.2 2-1.4 5.6-.6 8.3.6 2 .9 4.6 1.6 6.6.5 1.4 1.9 1.6 2.5.2.6-1.5.7-3.6 2.5-3.6s1.9 2.1 2.5 3.6c.6 1.4 2 1.2 2.5-.2.7-2 1-4.6 1.6-6.6.8-2.7 1.6-6.3-.6-8.3-1.7-1.6-4.4-1.2-6 0z"/></svg>
    </div>
    <div class="who"><b id="practice">Front Desk Assistant</b><span id="status">Connecting</span></div>
  </div>
</header>

<main id="log" aria-live="polite"><div class="thread" id="thread"></div></main>

<footer>
  <form class="compose" id="compose">
    <label for="q" class="sr" style="position:absolute;left:-9999px">Message</label>
    <textarea id="q" rows="1" placeholder="Message" autocomplete="off" enterkeyhint="send"></textarea>
    <button class="send" id="sendBtn" aria-label="Send" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
</footer>

<div class="lock" id="lock" hidden>
  <form id="lockForm">
    <h2>Office code</h2>
    <p>Enter the code your office uses for the assistant.</p>
    <input id="code" type="password" inputmode="text" autocomplete="current-password" aria-label="Office code">
    <div class="err" id="lockErr"></div>
    <button class="btn primary">Unlock</button>
  </form>
</div>

<script>
const $ = (s) => document.querySelector(s);
const thread = $('#thread');
const log = $('#log');
const money = (c) => '$' + Math.round((c || 0) / 100).toLocaleString('en-US');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const store = {
  get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let code = store.get('code') || '';
let history = [];   // text-only turns sent back for conversational memory
let context = {};   // last patient + treatment, so follow-ups like "send it to her" work
let busy = false;

// ---------- network ----------
let unlockWaiters = [];
async function api(path, body) {
  const opts = { headers: { 'x-access-code': code } };
  if (body) { opts.method = 'POST'; opts.headers['content-type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  if (r.status === 401) { await askForCode(); return api(path, body); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'The assistant is unavailable. Check your connection and try again.');
  return j;
}
function askForCode(message) {
  $('#lock').hidden = false;
  $('#lockErr').textContent = code ? 'That code didn\'t work.' : '';
  $('#code').value = '';
  $('#code').focus();
  return new Promise((res) => unlockWaiters.push(res));
}
$('#lockForm').onsubmit = (e) => {
  e.preventDefault();
  code = $('#code').value.trim();
  if (!code) return;
  store.set('code', code);
  $('#lock').hidden = true;
  unlockWaiters.splice(0).forEach((f) => f());
};

// ---------- rendering ----------
function scrollDown() { requestAnimationFrame(() => log.scrollTo({ top: log.scrollHeight, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' })); }

function addMine(text) {
  const d = document.createElement('div');
  d.className = 'msg me';
  d.textContent = text;
  thread.appendChild(d);
  scrollDown();
}

function botShell() {
  const d = document.createElement('div');
  d.className = 'msg bot';
  d.innerHTML = '<div class="text"><span class="typing" aria-label="Thinking"><span></span><span></span><span></span></span></div>';
  thread.appendChild(d);
  scrollDown();
  return d;
}

function formatReply(text) {
  // Problem lines in the briefing get the chart-red treatment.
  return esc(text).split('\n').map((line) =>
    line.startsWith('• ') ? `<span class="flag">${line.slice(2)}</span>` : line).join('\n').replace(/<\/span>\n/g, '</span>');
}

function estimateCard(b) {
  const lines = b.lines.map((l) => `<li>${l.tooth ? `<span class="tooth" aria-label="Tooth ${esc(l.tooth)}">#${esc(l.tooth)}</span>` : ''}<span class="nm">${esc(l.name)}</span><span class="amt">${money(l.patient)}</span></li>`).join('');
  const notes = b.notes?.length ? `<p class="est-note">${b.notes.map(esc).join('<br>')}</p>` : '';
  return `<div class="est" role="group" aria-label="Estimate for ${esc(b.patient)}">
    <div class="est-top">
      <div class="est-name">${esc(b.patient)} pays</div>
      <div class="est-total">${money(b.totals.patient)}<small>estimated</small></div>
      <div class="est-ins">Insurance pays ${money(b.totals.insurance)} of ${money(b.totals.fee)}</div>
    </div>
    <ul class="est-lines">${lines}</ul>${notes}
  </div>`;
}

function draftCard(b, holder) {
  const el = document.createElement('div');
  el.className = 'draft';
  el.innerHTML = `<h3>${esc(b.title)}</h3><div class="to">To ${esc(b.to)}</div>
    <textarea aria-label="Message to patient">${esc(b.text)}</textarea>
    <div class="row"><button class="btn primary" type="button">Send text</button><button class="btn quiet" type="button">Not now</button></div>`;
  const [sendB, skipB] = el.querySelectorAll('button');
  sendB.onclick = async () => {
    sendB.disabled = skipB.disabled = true;
    sendB.textContent = 'Sending';
    try {
      const r = await api('/api/confirm', { token: b.token, text: el.querySelector('textarea').value });
      el.classList.add('done');
      el.querySelector('textarea').readOnly = true;
      el.querySelector('.row').innerHTML = '';
      showBot(r);
    } catch (e) { sendB.disabled = skipB.disabled = false; sendB.textContent = 'Send text'; showBot({ reply: e.message }); }
  };
  skipB.onclick = () => { el.classList.add('done'); el.querySelector('.row').innerHTML = '<span class="to">Not sent.</span>'; };
  holder.appendChild(el);
}

function showBot(r, shell) {
  const d = shell || botShell();
  d.querySelector('.text').innerHTML = formatReply(r.reply || '');
  for (const b of r.blocks || []) {
    if (b.type === 'estimate') d.insertAdjacentHTML('beforeend', estimateCard(b));
    if (b.type === 'confirm') draftCard(b, d);
  }
  // Only the newest answer keeps its quick replies.
  thread.querySelectorAll('.chips').forEach((c) => c.remove());
  if (r.actions?.length) {
    const c = document.createElement('div');
    c.className = 'chips';
    r.actions.forEach((a) => {
      const btn = document.createElement('button');
      btn.className = 'chip'; btn.type = 'button'; btn.textContent = a.label;
      btn.onclick = () => ask(a.prompt, a.label);
      c.appendChild(btn);
    });
    d.appendChild(c);
  }
  if (r.context) context = r.context;
  scrollDown();
}

// ---------- conversation ----------
async function ask(text, shown) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  addMine(shown || text);
  const shell = botShell();
  try {
    const r = await api('/api/assistant', { message: text, history, context });
    history.push({ role: 'user', content: text }, { role: 'assistant', content: r.reply || '' });
    history = history.slice(-12);
    showBot(r, shell);
  } catch (e) {
    showBot({ reply: e.message }, shell);
  } finally { busy = false; }
}

const q = $('#q');
q.addEventListener('input', () => {
  q.style.height = 'auto';
  q.style.height = Math.min(q.scrollHeight, 140) + 'px';
  $('#sendBtn').disabled = !q.value.trim();
});
q.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#compose').requestSubmit(); }
});
$('#compose').onsubmit = (e) => {
  e.preventDefault();
  const t = q.value;
  q.value = ''; q.style.height = 'auto'; $('#sendBtn').disabled = true;
  ask(t);
};

// ---------- start: the assistant speaks first ----------
(async () => {
  try {
    const h = await fetch('/api/health').then((r) => r.json());
    if (h.practice) $('#practice').textContent = h.practice;
    $('#status').textContent = h.mode === 'live' ? 'Connected to your schedule' : 'Demo practice';
  } catch { $('#status').textContent = 'Offline'; }
  const shell = botShell();
  try { showBot(await api('/api/brief'), shell); }
  catch (e) { showBot({ reply: e.message }, shell); }
})();
</script>
</body>
</html>
